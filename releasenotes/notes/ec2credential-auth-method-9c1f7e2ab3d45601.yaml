---
security:
  - |
    [`bug 2153453 <https://bugs.launchpad.net/keystone/+bug/2153453>`__]
    Tokens minted from an EC2 or S3 credential exchange (``POST
    /v3/ec2tokens`` or ``POST /v3/s3tokens``) have always recorded the
    ``ec2credential`` auth method, which was never a registered auth
    method. The fernet token provider encodes ``methods`` as a bitmask of
    the configured ``[auth] methods``, so the marker was silently dropped
    on the token payload round-trip: on any validation that re-read the
    payload (cache miss, different process), the token looked like it had
    been issued with no auth methods at all.

    As a result, the guard that rejects EC2/S3-credential tokens from
    being used to authorize requests in Keystone could not recognize such
    tokens, and the guards that reject delegated tokens from re-scoping
    or managing trusts, application credentials, and OAuth1 access tokens
    only blocked them incidentally (an empty method list is treated as
    delegated by default). A stolen EC2 or S3 access/secret key pair could
    therefore be exchanged for a token and then used to authorize
    requests in Keystone.

    The ``ec2credential`` method is now a registered auth method backed
    by a non-functional (dummy) plugin, so the marker survives the token
    payload round-trip and tokens minted from an EC2 or S3 credential
    exchange are recognized as delegated-credential derived by all of the
    above guards. The plugin cannot authenticate: EC2 and S3 credentials
    must still be exchanged at their respective endpoints. The method can
    never be classified as a primary auth method, so listing it in
    ``[auth] additional_primary_auth_methods`` has no effect.
upgrade:
  - |
    [`bug 2153453 <https://bugs.launchpad.net/keystone/+bug/2153453>`___]
    ``ec2credential`` has been added to the end of the default
    ``[auth] methods`` list. It is a marker method backed by a dummy
    plugin that cannot authenticate; attempting to authenticate with the
    ``ec2credential`` method via ``/v3/auth/tokens`` is rejected with
    HTTP 401.

    The new method is appended to the end of the method list on purpose:
    the fernet method bitmask is positional, and appending preserves the
    bits of all existing methods, so existing tokens continue to
    validate. During a rolling upgrade, tokens minted with the new marker
    decode to an empty method list on not-yet-upgraded nodes (the unknown
    bit is dropped), which degrades to the pre-upgrade behavior and is
    still blocked from delegated-token actions by the deny-by-default
    rule.

    Tokens minted before the upgrade carry no recoverable marker: they
    continue to be blocked from re-scoping and from managing trusts,
    application credentials, and OAuth1 access tokens (an empty method
    list is treated as delegated by default), but they remain usable to
    authorize requests in Keystone until they expire. Reducing
    ``[token] expiration`` after the upgrade shortens that window.

    The ``ec2credential`` method must be present in ``[auth] methods``
    (it is included in the default list). Operators pinning an explicit
    ``methods`` list must add it after upgrading. While the method is
    disabled, ``POST /v3/ec2tokens`` and ``POST /v3/s3tokens`` refuse to
    issue tokens (HTTP 503): a token minted without the marker would not
    be recognized as delegated-credential derived on a token payload
    round-trip, so the endpoints fail closed rather than re-opening the
    vulnerability described above.
